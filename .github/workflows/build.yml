name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ColorMatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ColorMatch-apk
          path: ColorMatch.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ColorMatch build ${{ github.run_number }}
          body: APK pronto da installare. Scarica ColorMatch.apk dal telefono e aprilo.
          files: ColorMatch.apk
          make_latest: true
